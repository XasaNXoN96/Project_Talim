<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — Mirzacho‘l tumani Xalq ta’limi bo‘limi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&subset=latin,latin-ext&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-shell="app" data-page="chat" data-title="Chat" >
<main>
<div class="card chat">
 <div class="chat-list">
  <div style="padding:12px 16px"><div class="search"><span data-i="search" data-c="sm"></span><input placeholder="Suhbat qidirish" aria-label="Suhbat qidirish"></div></div>
  <button class="conv active"><span class="av" data-name="Rahbariyat"></span><div class="grow"><div class="row between"><b class="small">Rahbariyat</b><span class="xs muted">10:10</span></div><div class="small muted trunc">Yig‘ilish ertaga soat 10:00 da</div></div></button>
  <button class="conv"><span class="av" data-name="Ta’lim bo‘limi"></span><div class="grow"><div class="row between"><b class="small">Ta’lim bo‘limi</b><span class="xs muted">08:45</span></div><div class="row between"><span class="small muted trunc">Hisobot tayyor</span><span class="unread">2</span></div></div></button>
  <button class="conv"><span class="av" data-name="Metodik bo‘lim"></span><div class="grow"><div class="row between"><b class="small">Metodik bo‘lim</b><span class="xs muted">Kecha</span></div><div class="small muted trunc">Tavsiyalarni yubordim</div></div></button>
 </div>
 <div class="chat-pane">
  <div class="row" style="padding:12px 16px;border-bottom:1px solid var(--border)"><button class="btn btn-ghost btn-icon btn-sm chat-back" aria-label="Orqaga"><span data-i="left"></span></button><span class="av sm" data-name="Rahbariyat"></span><b>Rahbariyat</b><span class="demo-tag" style="margin-left:auto">Maket</span></div>
  <div class="chat-msgs"><div class="msg">Assalomu alaykum! Yig‘ilish ertaga soat 10:00 da.<small>10:10</small></div><div class="msg mine">Vaalaykum assalom, tushunarli.<small>10:12</small></div></div>
  <form class="chat-input" id="chatForm"><label class="sr-only" for="cm">Xabar</label><input class="input" id="cm" placeholder="Xabar yozing…" autocomplete="off"><button class="btn btn-primary btn-icon" aria-label="Yuborish"><span data-i="send" data-c="sm"></span></button></form>
 </div>
</div>
</main>
<script src="../assets/js/app.js"></script>
</body>
</html>
