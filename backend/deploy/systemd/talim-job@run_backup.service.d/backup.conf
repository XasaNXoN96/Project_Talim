# Drop-in for the backup jobs (adjust BACKUP_DIR below to the same path as in /etc/talim/backup.env).
# /etc/talim/backup.env (root:talim 0640) holds only NAMES AND PATHS, e.g.
#   BACKUP_DIR=/var/backups/talim   BACKUP_PASSPHRASE_FILE=/etc/talim/backup.pass   PGPASSFILE=/etc/talim/backup.pgpass
# The passphrase and the database password live in those two files (each 0600, owned by the service user), NOT in this file.
[Service]
EnvironmentFile=-/etc/talim/backup.env
ReadWritePaths=/var/backups/talim
TimeoutStartSec=3h
