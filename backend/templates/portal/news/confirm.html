{% extends "base_portal.html" %}
{% load i18n %}
{% block title %}{% translate "Tasdiqlash" %}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{% translate "Tasdiqlash" %}</h1></div></div>
<form method="post" action="{% url 'news_admin:status' news.pk action %}" class="card card-pad" style="display:grid;gap:16px;max-width:620px">
  {% csrf_token %}
  <p><b>{{ news.title }}</b></p>
  <p>{{ question }}</p>
  {% if step.decision %}<input type="hidden" name="version" value="{{ version }}">
  <div class="field"><label for="id_comment">{% translate "Izoh" %}{% if step.needs_comment %} *{% else %} ({% translate "ixtiyoriy" %}){% endif %}</label><textarea class="input" id="id_comment" name="comment" rows="4" maxlength="2000" {% if step.needs_comment %}required{% endif %}></textarea></div>{% endif %}
  <div class="row wrap"><button class="btn {% if action == 'publish' or action == 'approve' or action == 'submit' %}btn-primary{% elif action == 'restore' or action == 'withdraw' or action == 'request_changes' %}btn-secondary{% else %}btn-danger{% endif %}" type="submit">{% translate "Ha, tasdiqlayman" %}</button><a class="btn btn-secondary" href="{% url 'news_admin:preview' news.pk %}">{% translate "Bekor qilish" %}</a></div>
</form>
{% endblock %}
